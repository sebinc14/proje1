name: proje
description: "A comprehensive Flutter e-commerce project featuring various UI screens, state management, and Firebase integration."

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.0
  cached_network_image: ^3.3.1
  carousel_slider: ^5.0.0
  cupertino_icons: ^1.0.8
  
  # Serenay E-Commerce Widgets Paketi (Pub.dev üzerinden çekiyoruz)
  serenay_ecommerce_widgets: ^1.4.0
  image_picker: ^1.2.3
  firebase_storage: ^12.4.10
  intl: ^0.20.3
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

false_secrets:
  - /android/app/google-services.json
  - /lib/firebase_options.dart 